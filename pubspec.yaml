name: turfgo_flutter
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  flutter_native_splash: ^2.4.8
  injectable: ^3.0.0
  go_router: ^18.1.4
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  get_it: ^9.3.0
  internet_connection_checker: ^3.0.1
  google_fonts: ^9.0.0
  cupertino_ui: ^1.1.7
  material_ui: ^1.11.1
  flutter_svg: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  injectable_generator: ^3.1.3
  build_runner: ^2.16.1
  freezed: ^4.0.3


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svg/
    - assets/svg/flags/
    - assets/svg/icons/

  fonts:
    - family: Chivo
      fonts:
        - asset: assets/fonts/Chivo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Chivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Chivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Chivo-Bold.ttf
          weight: 700
